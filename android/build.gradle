// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Leitor de código: o app usa só o scan() do Google (Play Services, módulo
    // barcode_ui baixado pelo Play). O plugin também traz o ML Kit embutido
    // (libbarhopper, ~20 MB nas 4 arquiteturas, e os modelos) para o startScan(),
    // que o app não usa. A versão fina tem a mesma interface, com o modelo vindo
    // do Play Services.
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.google.mlkit:barcode-scanning') using module('com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
